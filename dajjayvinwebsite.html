<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VantagePoint — Live Observability</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#0a0a0a;--ring:rgba(255,255,255,.145);--sub:#999;--blue:#52a8ff;--green:#62c073;--violet:#a78bfa;--amber:#f5b544;--pink:#ff6b9d;--red:#ff5c5c;--teal:#4fd1c5;--sans:'Inter',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,Menlo,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:80px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:var(--sans);overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono)}
header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 14px) 56px 14px;background:rgba(0,0,0,.55);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
header.s{border-color:var(--ring)}
.logo{display:flex;align-items:center;gap:10px;font-weight:500;font-size:20px;letter-spacing:-.5px}
nav{display:flex;gap:32px}nav a{color:#ddd;transition:color .15s}nav a:hover{color:var(--blue)}
.btn{border-radius:0;background:#fff;color:#121212;border:0;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;font-weight:500;cursor:pointer;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--blue)}
.btn.lg{font-size:20px;padding:14px 22px}
.btn.ghost{background:transparent;color:#fff;border:1px solid var(--ring)}
.btn.ghost:hover{box-shadow:3px 3px 0 var(--violet)}
#burger{display:none;background:none;border:0;cursor:pointer}
#mm{position:fixed;inset:0;background:#000;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px;font-size:28px}
#mm.o{display:flex}
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;justify-content:center;padding:120px 24px 12vh;overflow:hidden}
.aurora{position:absolute;inset:0;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:fl 14s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:46vw;height:46vw;background:var(--blue);top:-10%;left:-8%}
.aurora i:nth-child(2){width:40vw;height:40vw;background:var(--violet);top:10%;right:-8%;animation-delay:-4s}
.aurora i:nth-child(3){width:34vw;height:34vw;background:var(--pink);top:40%;left:30%;opacity:.28;animation-delay:-8s}
.aurora i:nth-child(4){width:28vw;height:28vw;background:var(--teal);top:30%;left:5%;opacity:.25;animation-delay:-2s}
@keyframes fl{to{transform:translate(8vw,6vh) scale(1.2)}}
.grid{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/48px 48px;mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%)}
.scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.76) 0%,rgba(0,0,0,0) 93.785%)}
.hc{position:relative;text-align:center;max-width:800px}
.live{display:inline-flex;gap:8px;align-items:center;margin-bottom:22px}
h1{font-size:clamp(32px,5.4vw,64px);font-weight:500;letter-spacing:-2.5px;line-height:1.05;margin:0 0 20px}
.gt{background:linear-gradient(90deg,var(--blue),var(--violet),var(--pink),var(--amber));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 6s linear infinite}
@keyframes gs{to{background-position:200% 0}}
.hc p{color:#e7e7e7;margin:0 auto 32px;max-width:600px}
.hb{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
main{max-width:1240px;margin:0 auto;padding:96px 56px 40px}
section{margin-bottom:110px}
h2{font-size:clamp(28px,3.6vw,44px);font-weight:500;letter-spacing:-1.8px;margin:0 0 10px}
.lead{color:var(--sub);margin:0 0 28px;max-width:560px}
.eb{font-family:var(--mono);font-size:12px;color:var(--blue);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.card{position:relative;background:var(--card);border:1px solid var(--ring);transition:border-color .2s;overflow:hidden}
.card:hover{border-color:rgba(255,255,255,.32)}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(320px circle at var(--mx,50%) var(--my,0%),rgba(82,168,255,.14),transparent 60%);opacity:0;transition:opacity .25s;pointer-events:none}
.card:hover:before{opacity:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:#1f1f1f;border-radius:100px;padding:4px 10px;font:12px var(--mono);color:#999;text-transform:uppercase;border:0;white-space:nowrap}
button.chip{cursor:pointer;transition:background .15s,color .15s}
button.chip:hover{background:#2c2c2c}
button.chip.on{background:#fff;color:#000}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sub);flex:none}
.dot.pass{background:var(--green)}.dot.warn{background:var(--amber)}.dot.fail{background:var(--red);box-shadow:0 0 8px var(--red)}
.pulse{animation:pu 1.4s infinite}@keyframes pu{50%{opacity:.25}}
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--ring)}
.tb input{background:#111;border:1px solid var(--ring);padding:7px 10px;font:13px var(--mono);min-width:150px;flex:1;max-width:240px}
.sp{flex:1}
.stats{display:flex;gap:18px;font:12px var(--mono);color:var(--sub)}.stats b{color:#fff;font-weight:500}
.split{display:grid;grid-template-columns:240px 1fr}
#list{max-height:420px;overflow:auto;border-right:1px solid var(--ring);padding:8px}
.it{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:9px 8px;font:12px var(--mono);color:var(--sub);cursor:pointer;text-align:left;border-left:2px solid
